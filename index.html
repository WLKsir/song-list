<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌单列表</title>
    <script src="xlsx.full.min.js"></script>
    <style>
        /* ===== Semi Design Tokens (Dark Mode 映射) ===== */
        /* 主题 A：极光青紫（默认） */
        :root {
            --bg-inner: #0B1226;
            --bg-outer: #04060D;
            --card: rgba(23, 32, 59, 0.72);
            --card-hover: rgba(28, 39, 72, 0.85);
            --accent: #2DE1C2;
            --accent-hover: #5CEBD3;
            --accent-contrast: #04261F;
            --text-0: #F9F9F9;
            --text-1: rgba(249,249,249,0.8);
            --text-2: rgba(249,249,249,0.6);
            --bg-2: #2E3035;
            --fill-0: rgba(255,255,255,0.12);
            --fill-1: rgba(255,255,255,0.16);
            --fill-2: rgba(255,255,255,0.20);
            --border: rgba(255,255,255,0.10);
            --card-border: rgba(255,255,255,0.18);
            --th-bg: rgba(0,0,0,0.3);
            --radius-small: 3px;
            --radius-medium: 6px;
            --radius-large: 12px;
            --font-stack: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        /* 主题 B：落日暖调（明亮暖色浅色调） */
        html[data-theme="B"] {
            --bg-inner: #FFF3E2;
            --bg-outer: #FFDDB8;
            --card: rgba(255, 224, 189, 0.78);
            --card-hover: rgba(255, 233, 205, 0.92);
            --card-border: rgba(150, 82, 30, 0.22);
            --th-bg: rgba(255, 107, 53, 0.16);
            --accent: #FF6B35;
            --accent-hover: #FF8533;
            --accent-contrast: #FFFFFF;
            --text-0: #3D2314;
            --text-1: rgba(61, 35, 20, 0.8);
            --text-2: rgba(61, 35, 20, 0.6);
            --bg-2: #FFF1E0;
            --fill-0: rgba(120, 65, 20, 0.08);
            --fill-1: rgba(120, 65, 20, 0.13);
            --fill-2: rgba(120, 65, 20, 0.18);
            --border: rgba(120, 65, 20, 0.15);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-stack);
        }
        body {
            min-height: 100vh;
            /* 主题化径向渐变背景 */
            background: radial-gradient(circle at center, var(--bg-inner), var(--bg-outer)) fixed;
            padding: 30px 15px;
            color: var(--text-0);
        }
        /* 顶部工具条 */
        .topbar {
            max-width: 1100px;
            margin: 0 auto 12px;
            display: flex;
            justify-content: flex-end;
        }
        .theme-toggle::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 8px;
            vertical-align: -1px;
        }
        /* 卡片：去掉 backdrop-filter（大面积模糊是掉帧主因），
           改用半透明纯色 + 边框实现层次 */
        .glass-box {
            background: var(--card);
            border-radius: var(--radius-large);
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 20px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .glass-box:hover {
            background: var(--card-hover);
            border-color: var(--card-border);
        }
        .filter-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 0;
        }
        .filter-item {
            flex: 1;
            min-width: 180px;
            position: relative;
        }
        .filter-item label {
            color: var(--text-1);
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            line-height: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .btn-row{
            display:flex;
            gap:6px;
        }
        .dropdown-toggle {
            flex:1;
            padding: 0 14px;
            height: 36px;
            border-radius: var(--radius-small);
            border: 1px solid transparent;
            font-size: 14px;
            line-height: 20px;
            background: var(--fill-0);
            color: var(--text-0);
            text-align: left;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .dropdown-toggle:hover {
            background: var(--fill-1);
        }
        .clear-select-btn{
            padding: 0 12px;
            height: 36px;
            border-radius: var(--radius-small);
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-2);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .clear-select-btn:hover{
            background: var(--fill-1);
            color: var(--text-0);
        }
        .global-dropdown-panel {
            position: fixed;
            width: calc(180px + 14px);
            max-height: 260px;
            overflow-y: auto;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-medium);
            z-index: 9999999 !important;
            padding: 6px;
            display: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
        }
        .global-dropdown-panel::-webkit-scrollbar {
            display: none;
        }
        .global-dropdown-panel {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .global-dropdown-panel.show {
            display: block;
        }
        .dropdown-item {
            color: var(--text-0);
            padding: 8px 10px;
            font-size: 14px;
            line-height: 20px;
            cursor: pointer;
            border-radius: var(--radius-small);
            margin-bottom: 2px;
            transition: background 0.15s ease;
        }
        .dropdown-item:hover {
            background: var(--fill-1);
        }
        .dropdown-item.active {
            background: var(--accent);
            color: var(--accent-contrast);
            font-weight: 500;
        }
        .search-wrap-inline {
            flex:1;
            min-width:180px;
            position:relative;
        }
        .search-wrap-inline label{
            color: var(--text-1);
            display:block;
            margin-bottom:8px;
            font-size: 12px;
            line-height: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .search-input-box{
            position:relative;
        }
        #search-input {
            width: 100%;
            height: 36px;
            padding: 0 38px 0 14px;
            border-radius: var(--radius-small);
            border: 1px solid transparent;
            font-size: 14px;
            line-height: 20px;
            background: var(--fill-0);
            color: var(--text-0);
            outline: none;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        #search-input:hover {
            background: var(--fill-1);
        }
        #search-input:focus {
            background: var(--fill-0);
            border-color: var(--accent);
        }
        #search-input::placeholder {
            color: var(--text-2);
        }
        .search-icon{
            position:absolute;
            right:12px;
            top:50%;
            transform:translateY(-50%);
            color: var(--text-2);
            font-size:16px;
            pointer-events:none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: var(--text-0);
            margin-top:24px;
        }
        th, td {
            padding: 14px 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--th-bg);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-1);
        }
        td {
            font-size: 14px;
            line-height: 20px;
            color: var(--text-0);
        }
        td:nth-child(2), td:nth-child(3), td:nth-child(4) {
            color: var(--text-1);
        }
        td:nth-child(5) {
            color: var(--text-2);
        }
        .song-cell {
            white-space: nowrap;
        }
        .copy-btn {
            height: 24px;
            padding: 0 10px;
            margin-left: 8px;
            font-size: 12px;
            line-height: 16px;
            background: transparent;
            color: var(--text-2);
            border: 1px solid var(--border);
        }
        .copy-btn:hover:not(:disabled) {
            background: var(--fill-1);
            color: var(--text-0);
        }
        .copy-btn.copied {
            color: var(--accent);
            border-color: var(--accent);
            background: transparent;
        }
        tbody tr {
            transition: background 0.15s ease;
        }
        tbody tr:hover {
            background: var(--fill-0);
        }
        .table-wrap {
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .table-wrap.fade-out {
            opacity: 0;
        }
        .page-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap:10px;
            margin-top:20px;
        }
        button {
            height: 32px;
            padding: 0 18px;
            border-radius: var(--radius-small);
            border: none;
            cursor: pointer;
            font-size: 14px;
            line-height: 20px;
            background: var(--fill-0);
            color: var(--text-0);
            transition: background 0.15s ease, color 0.15s ease;
        }
        button:hover:not(:disabled) {
            background: var(--fill-1);
        }
        button:disabled{
            background: transparent;
            color: var(--text-2);
            opacity: 0.55;
            cursor:not-allowed;
        }
        .bottom-btn-area{
            text-align:center;
            margin-top:30px;
        }
        #to-wheel{
            height: 44px;
            padding: 0 30px;
            font-size: 16px;
            font-weight: 600;
            background: var(--accent);
            color: var(--accent-contrast);
        }
        #to-wheel:hover:not(:disabled) {
            background: var(--accent-hover);
        }
        .empty-tip{
            text-align:center;
            color: var(--text-2);
            padding:40px;
            font-size:14px;
        }
        #page-info {
            color: var(--text-2);
            font-size: 14px;
            line-height: 32px;
            margin: 0 12px;
        }
    </style>
</head>
<body>
    <script>
        // 尽早应用主题，避免刷新闪色
        document.documentElement.dataset.theme = localStorage.getItem("playlistTheme") || "A";
    </script>
    <div class="topbar">
        <button class="theme-toggle" id="theme-toggle">主题：极光青紫</button>
    </div>
    <div class="global-dropdown-panel" id="globalPanel"></div>

    <div class="glass-box">
        <div class="filter-row">
            <div class="filter-item" data-type="style">
                <label>主风格</label>
                <div class="btn-row">
                    <button class="dropdown-toggle">选择风格 ▾</button>
                    <button class="clear-select-btn">清除</button>
                </div>
            </div>
            <div class="filter-item" data-type="emotion">
                <label>情绪</label>
                <div class="btn-row">
                    <button class="dropdown-toggle">选择情绪 ▾</button>
                    <button class="clear-select-btn">清除</button>
                </div>
            </div>
            <div class="filter-item" data-type="range">
                <label>音域</label>
                <div class="btn-row">
                    <button class="dropdown-toggle">选择音域 ▾</button>
                    <button class="clear-select-btn">清除</button>
                </div>
            </div>
            <div class="filter-item" data-type="sub">
                <label>子类</label>
                <div class="btn-row">
                    <button class="dropdown-toggle">选择子类 ▾</button>
                    <button class="clear-select-btn">清除</button>
                </div>
            </div>
            <div class="filter-item" data-type="lang">
                <label>歌曲语种</label>
                <div class="btn-row">
                    <button class="dropdown-toggle">选择语种 ▾</button>
                    <button class="clear-select-btn">清除</button>
                </div>
            </div>
            <div class="filter-item" data-type="version">
                <label>歌曲版本</label>
                <div class="btn-row">
                    <button class="dropdown-toggle">选择版本 ▾</button>
                    <button class="clear-select-btn">清除</button>
                </div>
            </div>
            <div class="search-wrap-inline">
                <label>搜索歌曲</label>
                <div class="search-input-box">
                    <input id="search-input" type="text" placeholder="可搜索歌名 / 歌手">
                    <span class="search-icon">🔍</span>
                </div>
            </div>
        </div>
    </div>

    <div class="glass-box table-wrap" id="tableContainer">
        <table>
            <thead>
                <tr>
                    <th>歌曲名称</th>
                    <th>歌曲版本</th>
                    <th>主风格</th>
                    <th>情绪</th>
                    <th>歌曲语种</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
        <div id="empty-text" class="empty-tip" style="display:none;">暂无匹配歌曲</div>
        <div class="page-box">
            <button id="prev">上一页</button>
            <span id="page-info"></span>
            <button id="next">下一页</button>
        </div>
    </div>

    <div class="bottom-btn-area">
        <button id="to-wheel">前往歌曲转盘</button>
    </div>

<script>
let allData = [];
let filterData = [];
const pageSize = 10;
let currentPage = 1;
const selected = {
    style: null,
    emotion: null,
    range: null,
    sub: null,
    lang: null,
    version: null
};
let currentOpenType = null;
const globalPanel = document.getElementById("globalPanel");

const searchInput = document.getElementById("search-input");
const tableBody = document.getElementById("table-body");
const emptyText = document.getElementById("empty-text");
const pageInfo = document.getElementById("page-info");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const toWheelBtn = document.getElementById("to-wheel");
const tableContainer = document.getElementById("tableContainer");

function debounce(fn, delay=180){
    let timer;
    return (...args)=>{
        clearTimeout(timer);
        timer = setTimeout(()=>fn(...args), delay);
    }
}

const DATA_FILES = ["最新歌单.xlsx"];

function str(v){ return String(v ?? "").trim(); }
function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// 复制到剪贴板：优先 Clipboard API，非安全上下文降级 execCommand
function copyText(text, done){
    const fallback = ()=>{
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try{ document.execCommand("copy"); done && done(); }
        catch(e){ console.warn("复制失败:", e); }
        document.body.removeChild(ta);
    };
    if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(text).then(()=>done && done(), fallback);
    }else{
        fallback();
    }
}
function flashCopied(btn){
    btn.classList.add("copied");
    const old = "复制";
    btn.innerText = "已复制";
    clearTimeout(btn._copyTimer);
    btn._copyTimer = setTimeout(()=>{
        btn.innerText = old;
        btn.classList.remove("copied");
    }, 1200);
}
// 表格内复制按钮：事件委托（行内容会整体重建）
tableBody.addEventListener("click", (e)=>{
    const btn = e.target.closest(".copy-btn");
    if(!btn) return;
    e.stopPropagation();
    copyText(btn.dataset.name || "", ()=>flashCopied(btn));
});
function splitVals(v){ return str(v).split("、").map(x=>x.trim()).filter(Boolean); }

// 统计某列各取值出现次数（子类等列可能用「、」存多个值）
function countBy(colName){
    const m = new Map();
    allData.forEach(i=>{
        splitVals(i[colName]).forEach(x=> m.set(x, (m.get(x)||0)+1));
    });
    return m;
}
// 按出现频次降序
function byFreq(colName){
    return [...countBy(colName).entries()]
        .sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0],"zh-CN"))
        .map(e=>e[0]);
}
// 指定顺序优先，其余按拼音追加
function byOrder(colName, order){
    const m = countBy(colName);
    const rest = [...m.keys()].filter(k=>!order.includes(k))
                              .sort((a,b)=>a.localeCompare(b,"zh-CN"));
    return [...order.filter(k=>m.has(k)), ...rest];
}

const LANG_ORDER = ["国语","粤语","日语","英语"];
const RANGE_ORDER = ["高音","低音"];

function initDropdownData(){
    window.dropSource = {
        style:   byFreq("主风格"),
        emotion: byFreq("情绪"),
        range:   byOrder("音域", RANGE_ORDER),
        sub:     byFreq("子类"),
        lang:    byOrder("歌曲语种", LANG_ORDER),
        version: [...countBy("歌曲版本").keys()].sort((a,b)=>a.localeCompare(b,"zh-CN"))
    };
}

async function loadExcel(){
    for(const file of DATA_FILES){
        try{
            const res = await fetch(file);
            if(!res.ok) continue;
            const buf = await res.arrayBuffer();
            const workbook = XLSX.read(buf);
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            allData = XLSX.utils.sheet_to_json(sheet);
            initDropdownData();
            filterChange();
            return;
        }catch(e){
            console.warn("歌单读取失败:", file, e);
        }
    }
    emptyText.style.display = "block";
    emptyText.innerText = "歌单文件加载失败，请确认 xlsx 与本页在同一目录";
}
function renderPanel(type){
    const arr = window.dropSource[type];
    globalPanel.innerHTML = "";
    arr.forEach(val=>{
        const div = document.createElement("div");
        div.className = "dropdown-item";
        div.dataset.val = val;
        div.innerText = val;
        if(selected[type] === val) div.classList.add("active");
        div.onclick = (e)=>{
            e.stopPropagation();
            selected[type] = selected[type] === val ? null : val;
            updateLabel(type);
            filterChange();
            closePanel();
        }
        globalPanel.appendChild(div);
    })
}
function updateLabel(type){
    const wrap = document.querySelector(`.filter-item[data-type="${type}"]`);
    const btn = wrap.querySelector(".dropdown-toggle");
    const map = {style:"风格",emotion:"情绪",range:"音域",sub:"子类",lang:"语种",version:"版本"};
    if(selected[type] === null){
        btn.innerText = `选择${map[type]} ▾`;
    }else{
        btn.innerText = `${selected[type]} ▾`;
    }
}
function openPanel(type, triggerEl){
    currentOpenType = type;
    renderPanel(type);
    const rect = triggerEl.getBoundingClientRect();
    globalPanel.style.left = rect.left + "px";
    globalPanel.style.top = (rect.bottom + 8) + "px";
    globalPanel.classList.add("show");
}
function closePanel(){
    globalPanel.classList.remove("show");
    currentOpenType = null;
}
document.querySelectorAll(".dropdown-toggle").forEach(btn=>{
    btn.onclick = (e)=>{
        e.stopPropagation();
        const itemWrap = btn.closest(".filter-item");
        const type = itemWrap.dataset.type;
        if(currentOpenType === type){
            closePanel();
        }else{
            openPanel(type, btn);
        }
    }
})
document.querySelectorAll(".clear-select-btn").forEach(btn=>{
    btn.onclick = (e)=>{
        e.stopPropagation();
        const itemWrap = btn.closest(".filter-item");
        const type = itemWrap.dataset.type;
        selected[type] = null;
        updateLabel(type);
        filterChange();
    }
})
document.addEventListener("click",()=>closePanel());

const filterChange = debounce(()=>{
    const keyword = searchInput.value.trim().toLowerCase();
    filterData = allData.filter(item=>{
        // 新表每列都是单值，直接严格相等；子类按「、」拆开兼容多值
        if(selected.style && str(item["主风格"]) !== selected.style) return false;
        if(selected.emotion && str(item["情绪"]) !== selected.emotion) return false;
        if(selected.range && str(item["音域"]) !== selected.range) return false;
        if(selected.sub && !splitVals(item["子类"]).includes(selected.sub)) return false;
        if(selected.lang && str(item["歌曲语种"]) !== selected.lang) return false;
        if(selected.version && str(item["歌曲版本"]) !== selected.version) return false;
        if(keyword){
            const name = String(item["歌曲名称"]||"").toLowerCase();
            const ver = String(item["歌曲版本"]||"").toLowerCase();
            if(!name.includes(keyword) && !ver.includes(keyword)) return false;
        }
        return true;
    })
    currentPage = 1;
    renderTable();
})

function renderTable(){
    tableContainer.classList.add("fade-out");
    setTimeout(()=>{
        const total = filterData.length;
        const totalPage = Math.ceil(total / pageSize);
        const start = (currentPage -1)*pageSize;
        const pageList = filterData.slice(start, start + pageSize);

        if(total ===0){
            tableBody.innerHTML = "";
            emptyText.style.display = "block";
        }else{
            emptyText.style.display = "none";
            tableBody.innerHTML = pageList.map(row=>{
                const name = str(row["歌曲名称"]);
                return `
                <tr>
                    <td class="song-cell"><span>${esc(name)}</span><button class="copy-btn" data-name="${esc(name)}" title="复制歌名">复制</button></td>
                    <td>${str(row["歌曲版本"])}</td>
                    <td>${str(row["主风格"])}</td>
                    <td>${str(row["情绪"])}</td>
                    <td>${str(row["歌曲语种"])}</td>
                </tr>
            `}).join("");
        }
        pageInfo.innerText = `第${currentPage}/${totalPage||1}页 共${total}首`;
        prevBtn.disabled = currentPage <=1;
        nextBtn.disabled = currentPage >= totalPage;
        tableContainer.classList.remove("fade-out");
    },220)
}

searchInput.addEventListener("input", filterChange);
prevBtn.onclick = ()=>{
    if(currentPage>1){currentPage--;renderTable();}
}
nextBtn.onclick = ()=>{
    const totalPage = Math.ceil(filterData.length / pageSize);
    if(currentPage < totalPage){currentPage++;renderTable();}
}
toWheelBtn.onclick = ()=>{
    localStorage.setItem("wheelSongList", JSON.stringify(filterData));
    location.href = "wheel.html";
}
const THEME_NAMES = {A: "极光青紫", B: "落日暖调"};
const themeToggle = document.getElementById("theme-toggle");
function syncThemeLabel(){
    themeToggle.innerText = `主题：${THEME_NAMES[document.documentElement.dataset.theme] || "极光青紫"}`;
}
themeToggle.onclick = ()=>{
    const next = document.documentElement.dataset.theme === "B" ? "A" : "B";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("playlistTheme", next);
    syncThemeLabel();
}
syncThemeLabel();

loadExcel();
</script>
